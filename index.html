:root{--sky:#F4F6EE;--cloud:#DCEDEF;--hill:#CFDDA8;--hill2:#A9C99A;--deep:#73A886;--deeper:#5E9273;--sun:#E9DC8F;--pink:#F3CBD0;--lilac:#E4D5EF;--blue:#D3E8F4;--peach:#F1DCC6;--lime:#EEF5C4;--ink:#3D3D3A;--muted:#666A5E;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#E7EBDF;color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;background:var(--sky);min-height:100vh;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.06)}
h1,h2,h3{font-family:Corm,Georgia,serif;font-weight:500;margin:0;line-height:1;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(46px,14vw,58px)}h2{font-size:clamp(36px,10.5vw,44px)}h3{font-size:clamp(26px,7.6vw,31px);line-height:1.1}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--deeper);font-weight:600}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}
.logo{display:flex;align-items:center;gap:8px;font-family:Corm,Georgia,serif;font-size:21px;line-height:1;background:none;border:0;padding:0;text-align:left}
.logo small{display:block;font-family:Manrope,sans-serif;font-size:10px;color:var(--muted);margin-top:2px}
.wrap{padding:0 20px;display:flex;flex-direction:column;gap:16px}
.screen{padding-bottom:10px}
/* приветствие */
.hero{padding:28px 20px 0}
.hero .sub{margin:14px 0 20px;color:var(--muted);max-width:310px}
.btn{display:block;width:100%;text-align:center;background:var(--deep);color:#fff;border:0;border-radius:30px;padding:15px 24px;font-weight:600;font-size:16px;transition:background .15s,transform .1s}
.btn:hover{background:var(--deeper)}.btn:active{transform:scale(.98)}
.hero .btn{display:inline-block;width:auto}
.tag{display:inline-block;background:#fff;border-radius:30px;padding:10px 20px;font-weight:600;font-size:14px}
.scene{display:block;width:calc(100% + 40px);margin:-6px -20px 0;height:auto}
.about{background:var(--hill);padding:6px 20px 34px}
.about p{margin:14px 0 0}.about .tag{margin-top:18px}
.spheres{background:var(--hill);padding:10px 20px 24px}
.spheres .q{color:var(--muted);margin:10px 0 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 12px}
.sp{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:none;border:0;padding:8px 4px 10px;border-radius:22px;transition:background .15s,transform .1s}
.sp:hover{background:rgba(255,255,255,.35)}.sp:active{transform:scale(.97)}
.sp svg{width:112px;height:104px}
.sp b{font-weight:600;font-size:15px}.sp small{color:var(--muted);font-size:12.5px;line-height:1.3}
.wave{display:block;width:100%;height:auto}
.learn{background:var(--deep);padding:4px 20px 40px;color:#fff}
.learn h2{color:#E4EFB6}
.cards{display:flex;flex-direction:column;gap:30px;margin-top:22px}
.card{position:relative;background:#F4F7F1;color:var(--ink);border:1.6px solid var(--ink);border-radius:12px;padding:16px 16px 18px;box-shadow:4px 4px 0 rgba(0,0,0,.15)}
.card b{display:block;margin-bottom:6px;padding-right:26px}
.card::after{content:"";position:absolute;left:28px;bottom:-12px;width:20px;height:20px;background:#F4F7F1;border-right:1.6px solid var(--ink);border-bottom:1.6px solid var(--ink);transform:rotate(45deg)}
.card .num{position:absolute;right:14px;top:8px;font-family:Corm,serif;font-size:34px;color:var(--deep);line-height:1}
.foot{padding:26px 20px 34px;display:flex;flex-direction:column;gap:14px}
.note{font-size:12.5px;color:var(--muted)}
.author{font-size:14px;color:var(--muted);border-top:1px solid #DDE3D2;padding-top:14px}
.author a{color:var(--deeper)}
/* шкала возраста */
.ages{display:flex;align-items:center;padding:18px 20px 4px}
.ages span{font-size:11px;color:var(--muted);width:24px;height:24px;border-radius:50%;border:1.3px solid #B9C3A9;display:grid;place-items:center;flex:none;background:var(--sky)}
.ages span.done{background:var(--hill2);border-color:var(--hill2);color:#fff}
.ages span.now{background:var(--deep);border-color:var(--deep);color:#fff;width:30px;height:30px;font-weight:600;font-size:12px}
.ages i{flex:1;height:1.3px;background:#B9C3A9;min-width:3px}.ages i.done{background:var(--hill2)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--deeper);font-weight:600}
.muted{color:var(--muted)}.small{font-size:14px}
.art{display:block;width:100%;max-width:350px;height:auto;margin:0 auto -4px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:12px 14px;box-shadow:3px 3px 0 rgba(0,0,0,.12);font-size:15px;line-height:1.4;transition:background .15s,transform .1s}
.opt:hover{background:var(--lime)}.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.12)}
.ghost{display:block;width:100%;text-align:center;background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:30px;padding:14px 16px;font-weight:600;font-size:15px;transition:background .15s}
.ghost:hover{background:var(--lime)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row.wide{grid-template-columns:1fr}
.bubble{position:relative;background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:14px 16px;box-shadow:3px 3px 0 rgba(0,0,0,.12);margin-bottom:8px}
.bubble::after{content:"";position:absolute;left:26px;bottom:-10px;width:16px;height:16px;background:#fff;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg)}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted);margin-bottom:6px}
.decision{position:relative;padding:22px 24px 34px;text-align:center}
.decision>svg.bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.decision>*{position:relative;z-index:1}
.decision .art{max-width:300px}
.decision .q{font-family:Corm,serif;font-style:italic;font-size:clamp(28px,8.4vw,34px);line-height:1.08;margin-top:6px;text-wrap:balance}
.center{text-align:center}
.pill{display:inline-block;align-self:flex-start;background:var(--lime);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600}
.box{border-radius:18px;padding:16px 16px 18px;position:relative}
.box.lilac{background:var(--lilac)}.box.lime{background:var(--lime)}.box.blue{background:var(--blue)}.box.peach{background:var(--peach)}.box.pink{background:var(--pink)}
.box h3{font-size:clamp(24px,7vw,27px)}
.badge{position:absolute;right:12px;top:-20px;width:46px;height:46px}
.grown{display:block;width:100%;height:auto}
.green{background:var(--hill);padding:4px 20px 28px;margin-top:-2px}
/* итог */
.res{background:var(--deep);color:#fff;padding:26px 20px 30px;margin-top:6px}
.res .kick{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#E4EFB6;font-weight:600}
.res h2{color:#fff;font-size:clamp(42px,12.5vw,50px);margin:8px 0 6px}
.res .sub{color:#E4EFB6;font-family:Corm,serif;font-size:25px;line-height:1.1;margin-bottom:14px}
.res ul{margin:8px 0 0;padding-left:18px}.res li{margin:4px 0}
.res .label{color:#E4EFB6;margin-top:16px}
.res .bubble{color:var(--ink);margin-top:20px;font-family:Corm,serif;font-size:25px;line-height:1.15}
.sign{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:#E4EFB6;margin-top:22px;border-top:1px solid rgba(255,255,255,.3);padding-top:10px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:128px 1fr 18px;gap:10px;align-items:center;font-size:13.5px}
.bar .t{height:12px;border-radius:8px;background:#E6EADF;overflow:hidden}.bar .t i{display:block;height:100%;border-radius:8px}
.bar.top{font-weight:600}.bar span:last-child{text-align:right;color:var(--muted)}
.cta{background:var(--pink);border-radius:18px;padding:16px}
.cta b{font-family:Corm,serif;font-weight:500;font-size:27px;display:block;margin-bottom:6px}
.btn:focus-visible,.ghost:focus-visible,.opt:focus-visible,.sp:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
@media (max-width:360px){.bar{grid-template-columns:108px 1fr 16px}.ages span{width:21px;height:21px;font-size:10px}.ages span.now{width:26px;height:26px}.row{grid-template-columns:1fr}}
@media (min-width:520px){body{padding:24px 0}#app{border-radius:28px;min-height:calc(100vh - 48px)}}
.nick{white-space:nowrap}
.us{display:inline-block;width:2.3em;height:.1em;border-bottom:.085em solid currentColor;vertical-align:-.06em;margin:0 .03em}
a:has(.nick){text-decoration:none}

 {group:"rel", who:"С мужем", title:"Он не пишет", text:"Вечер. Муж обещал вернуться в семь. Уже девять, он не пишет и не отвечает.", by:{
  udobnaya:["Аня греет ужин в третий раз. Когда он приходит, она улыбается: «Ничего страшного, я понимаю». Внутри обида, но показать её страшно: вдруг он решит, что она скандальная.","Он так и не узнаёт, что ей было тревожно и обидно. Обида остаётся внутри и копится.","Аня говорит: «Я рада, что ты дома. Но мне было тревожно и обидно, что ты не написал». Голос немного дрожит. И ничего не рушится."],
  silnaya:["Аня ужинает одна, укладывает детей и садится работать. «Не очень-то и ждала». Когда он приходит, она уже спит или делает вид.","Она снова убеждается: рассчитывать можно только на себя. Между ними становится чуть холоднее.","Аня замечает: ей правда не всё равно. И пишет: «Ты где? Я переживаю. Мне важно, чтобы ты предупреждал»."],
  otlichnitsa:["Аня перебирает: может, это она что-то сделала не так? Может, она недостаточно интересная, недостаточно хорошая жена? Ужин идеальный, и всё равно кажется, что этого мало.","Она старается ещё больше и устаёт ещё сильнее. Его опоздание стало для неё оценкой.","Аня замечает мысль «я недостаточно хороша» и отделяет её: «Он задержался. Это про его вечер, а не про мою ценность». И спрашивает, что случилось."],
  nevidimka:["Аня листает телефон и говорит себе: «Всё нормально». Он приходит, спрашивает, как дела. «Нормально». А потом весь вечер молчит.","Он чувствует холод, но не понимает, в чём дело. Она чувствует, что её не понимают. Оба чувствуют одиночество.","Аня пробует назвать хотя бы одно чувство: «Знаешь, я сегодня волновалась». Одно предложение, и между ними становится теплее."],
  chutkaya:["Аня пишет ему пятое сообщение. Представляет аварию, другую женщину, его плохое настроение. Когда он входит, она первым делом всматривается в его лицо: злой? довольный?","Тревога отпускает, только когда она убеждается, что всё хорошо. До следующего раза.","Аня замечает: «Мне страшно, как в детстве». Кладёт руку на грудь, дышит. И потом спрашивает его прямо, а не угадывает."],
  opora:["Аня пишет: «Ты где? Я начинаю волноваться». Когда он приходит, говорит: «Мне было тревожно. Давай договоримся, что ты предупреждаешь». Они обсуждают это без скандала и без молчания.","Ей неприятно, но она не теряет себя.","Аня ловит себя на том, что пишет уже пятое сообщение. Останавливается, выдыхает и спокойно ждёт: всё скажет, когда он придёт."]}},
 {group:"rel", who:"С мужем", title:"Выходные", text:"Пятница. Он радостно говорит: «В субботу едем к моим друзьям на дачу!» А Аня мечтала просто выспаться и побыть дома.", by:{
  udobnaya:["«Конечно, поехали!» На даче она весь день помогает, улыбается и моет посуду за всеми.","В воскресенье она возвращается выжатой и раздражённой. И не может объяснить почему: ведь она сама согласилась.","Аня делает паузу и говорит: «Я так устала за неделю. Поезжай, а я останусь дома». Ей неловко. А он отвечает: «Ладно, отдыхай»."],

  otlichnitsa:["Аня едет и старается быть идеальной: печёт пирог, поддерживает все разговоры. Его друзья должны увидеть, как ему повезло.","Её хвалят. Но отдыха не было, был экзамен. Она вымотана.","Аня едет, но разрешает себе не стараться: ничего не печь, посидеть в стороне, уйти спать пораньше. И удивляется: её всё равно любят."],
  nevidimka:["Она молча соглашается. На даче весь день отвечает «всё хорошо» и сидит в телефоне.","Потом он спрашивает: «Тебе не понравилось?» – «Да нет, нормально». Разговор опять не случился.","Аня говорит: «Если честно, мне не хочется. Я мечтала отдохнуть дома». Сказать «не хочу» вслух – маленький смелый шаг."],
  chutkaya:["Она смотрит на его лицо: он так радуется. Если откажет, он расстроится, может, обидится. Слишком рискованно. «Поехали».","Все выходные она следит, чтобы ему было хорошо, и не замечает, как ей самой.","Аня говорит о своём желании и выдерживает паузу, пока он реагирует. Он немного расстроен. И это можно пережить: его настроение не её ответственность."],
  opora:["«Я бы хотела остаться дома, очень устала. Может, ты съездишь, а в следующий раз поедем вместе?» Они ищут вариант, где хорошо обоим.","Её «не хочу» никого не разрушает.","Аня по привычке говорит «поехали» и через час понимает, что не хочет. Она возвращается к мужу: «Я передумала, мне нужно отдохнуть»."]}},
 {group:"rel", who:"С мужем", title:"Болезнь", text:"Аня заболела: температура, всё болит. Он заглядывает в комнату: «Тебе что-нибудь нужно?»", by:{

  udobnaya:["Аня сразу извиняется: «Прости, ты прав». Даже если не согласна. Лишь бы он перестал злиться.","Ссора заканчивается быстро. Но её мнение опять исчезло.","«Мне обидно это слышать. И я вижу это по-другому». Сказать своё во время ссоры страшно. И это возможно."],
  silnaya:["«Ну и ладно». Она уходит в другую комнату и решает справиться без него. Ей вообще никто не нужен.","Конфликт не решён, зато она сильная. И очень одинокая.","Аня остаётся в разговоре: «Мне важно, чтобы мы это обсудили. Я не хочу уходить»."],
  otlichnitsa:["Для неё это как двойка: значит, она плохая. Она то оправдывается, то по пунктам доказывает, что права.","Спор превращается в экзамен, который нужно выиграть. А близости нет.","Аня вспоминает: ошибиться не значит быть плохой. «Может, я правда что-то усложнила. Но мне сейчас обидно»."],
  nevidimka:["Аня замолкает. Не спорит, не плачет, не отвечает. Просто выключается.","Он злится ещё сильнее на её молчание. А она прячется ещё глубже.","«Мне сейчас трудно говорить. Дай мне десять минут, и я вернусь». И возвращается."],
  chutkaya:["Внутри всё сжимается, как в детстве, когда начинался крик. Она готова на всё, лишь бы гроза прошла.","Она гасит его злость, а сама остаётся в страхе.","Аня напоминает себе: «Я взрослая. Его злость – не катастрофа. Я в безопасности». И отвечает спокойнее."],
  opora:["«Мне неприятно, когда ты так говоришь. Давай разберёмся, что тебя задело». Ей неприятно, но она остаётся в разговоре.","Ссора для неё – часть отношений, а не конец любви.","Аня срывается и хлопает дверью. Через десять минут возвращается: «Я погорячилась. Давай поговорим»."]}},
 {group:"rel", who:"С мужем", title:"Комплимент", text:"Он обнимает Аню на кухне: «Ты сегодня очень красивая».", by:{
  udobnaya:["«Да ладно, ничего особенного». И тут же спрашивает, не подать ли ему чего-нибудь.","Комплимент пролетает мимо. Ей привычнее давать, чем получать.","Аня останавливается: «Спасибо. Мне приятно». И просто стоит в его объятиях."],
  silnaya:["Она отшучивается и выскальзывает из объятий: дел много.","Тепло было рядом, но она не позволила себе его взять.","Аня задерживается в объятиях на минуту дольше. Оказывается, можно немного побыть не сильной."],
  otlichnitsa:["«Да брось, я не накрашена, и волосы ужасные». Она сразу видит в себе все недостатки.","Похвала только напоминает ей, что идеальной она так и не стала.","Аня говорит «спасибо» и не добавляет ни одного «но»."],
  nevidimka:["Она смущённо молчит и быстро переводит разговор на ужин.","Он чувствует, что его тепло не дошло. В следующий раз он скажет меньше.","Аня поднимает глаза: «Мне очень приятно, когда ты так говоришь»."],
  chutkaya:["Внутри мелькает: «С чего вдруг? Что-то случилось? Ему что-то нужно?»","Даже хорошее она проверяет на опасность и не может просто порадоваться.","Аня замечает свою настороженность и решает поверить: иногда комплимент – это просто комплимент."],
  opora:["«Спасибо, мне приятно». Она улыбается и обнимает его в ответ.","Любовь для неё не подвох и не долг. Её можно просто принимать.","Аня отмахивается: «Да ладно тебе». Потом улыбается: «Хотя нет. Спасибо, мне приятно»."]}},
 {group:"rel", who:"С мужем", title:"Пальто", text:"Аня увидела пальто, о котором давно мечтала. Оно дорогое, но деньги на него в семье есть.", by:{
  udobnaya:["Она откладывает покупку: сначала детям, мужу, маме. Себе потом.","«Потом» никак не наступает. Она снова в старом пальто и чуть-чуть обижена на всех.","Аня говорит мужу: «Я хочу купить себе это пальто». И покупает."],
  silnaya:["Она покупает пальто сама, ни с кем не советуясь, и никому не показывает.","Радость есть, но разделить её не с кем. Она и тут одна.","Аня показывает пальто мужу: «Смотри, о чём я мечтала». Радость становится вдвое больше."],
  otlichnitsa:["«Я ещё не заработала на такое. Вот закончу проект, тогда…»","Подарок себе снова надо заслужить.","Аня разрешает себе: «Я хочу его просто потому, что хочу». И покупает."],
  nevidimka:["Она даже не говорит, что хочет это пальто. Просто проходит мимо витрины.","Никто так и не узнал о её мечте. И сама она почти забыла.","Аня говорит вслух: «Я так хочу это пальто». Уже это многое меняет."],
  chutkaya:["Она представляет, как отреагирует муж: вдруг будет недоволен? Лучше не рисковать.","Её желание опять уступает чужому недовольству, которого может и не быть.","Аня спрашивает мужа прямо, а не угадывает. Оказывается, он только за."],
  opora:["Аня примеряет, радуется и покупает. Вечером показывает мужу.","Заботиться о себе для неё так же естественно, как о других.","Аня откладывает покупку «на потом». Вечером замечает это и всё-таки возвращается за пальто."]}},
 {group:"rel", who:"С подругой", title:"Шутка", text:"На встрече с подругами одна из них при всех шутит над Аниной новой стрижкой. Все смеются.", by:{
  udobnaya:["Аня смеётся вместе со всеми, чтобы не портить вечер.","Вечер не испорчен. Испорчено только её настроение.","На следующий день Аня пишет подруге: «Мне было неприятно, когда ты пошутила про стрижку»."],
  silnaya:["«Ерунда, мне всё равно». Она делает вид, что её это не задело.","Задело, конечно. Но признаться в этом для неё значит быть слабой.","Аня признаёт: «Мне обидно». И рассказывает об этом другой подруге."],
  otlichnitsa:["Весь вечер она думает: может, стрижка правда ужасная? Надо было выбрать другую.","Шутка подруги превратилась в её собственную двойку.","Аня говорит себе: «Мне нравится моя стрижка. Шутка – про подругу, а не про меня»."],
  nevidimka:["Аня замолкает и до конца вечера почти не говорит.","Никто не понял, что случилось. Она ушла раньше всех и чувствовала себя чужой.","Аня отвечает спокойно: «Мне не смешно. Мне моя стрижка нравится»."],
  chutkaya:["Она тут же ищет признаки: может, подруга на неё злится? Что она сделала не так?","Весь вечер уходит на то, чтобы считывать подругу. Себя не слышно.","Аня спрашивает подругу напрямую: «У нас всё в порядке? Мне показалось твоё высказывание колким»."],
  opora:["«А мне нравится! Но было неприятно, давай без таких шуток». Она говорит это легко и не обижается весь вечер.","Она может защитить себя и не разрушить дружбу.","Аня смеётся вместе со всеми, а дома чувствует обиду. На следующий день спокойно говорит подруге, что ей было неприятно."]}},
 {group:"rel", who:"С мамой", title:"Звонок мамы", text:"Звонит мама: «Ты совсем про меня забыла. Я тут одна, никому не нужна».", by:{
  udobnaya:["Аня сразу чувствует вину. Отменяет свои планы и едет к маме.","Мама довольна. А Аня снова отложила свою жизнь.","«Мам, я тебя люблю. Сегодня не смогу, приеду в воскресенье». Вина есть, но Аня её выдерживает."],
  silnaya:["Она молча переводит маме деньги, заказывает продукты и берёт всё на себя.","Она снова взрослая для своей мамы. Как в детстве.","Аня просит брата тоже участвовать. Она не обязана тянуть всё одна."],
  otlichnitsa:["Аня оправдывается: столько работы, она старается, она правда хорошая дочь.","Разговор похож на отчёт перед строгим учителем.","Аня не оправдывается: «Я понимаю, что тебе одиноко. Давай договоримся, когда я приеду»."],
  nevidimka:["«Угу. Ладно. Да». Она кладёт трубку и весь день ходит с тяжестью внутри.","Чувства остались внутри и давят.","Аня говорит: «Мне тяжело это слышать, мам. Я тоже по тебе скучаю»."],
  chutkaya:["По маминому голосу Аня сразу понимает, какой будет разговор, и вся сжимается.","Даже взрослой она слушает маму так, будто ждёт грозы.","Аня напоминает себе: «Я уже не ребёнок. Я могу закончить разговор, если станет тяжело»."],
  opora:["«Мам, слышу, тебе одиноко. Давай я приеду в субботу?» Она заботится о маме и не забывает о себе.","Она может любить маму и оставаться взрослой.","Из чувства вины Аня обещает приехать сегодня же. Потом перезванивает: «Мам, я погорячилась. Приеду в воскресенье»."]}},
 {group:"work", who:"С начальником", title:"Замечание", text:"На планёрке начальник при всех говорит: «Отчёт нужно переделать».", by:{
  udobnaya:["«Конечно, переделаю сегодня же!» Даже если на это уйдёт вечер, который она обещала детям.","Она снова выбирает быть удобной сотрудницей, а не живым человеком.","«Хорошо. Сделаю к завтрашнему обеду». Вечер остаётся её."],
  silnaya:["Она не спрашивает, что именно не так, и молча переделывает всё до ночи.","Можно было уточнить и потратить час. Ушло пять.","Аня спрашивает: «Что конкретно поправить?» Просить ясности тоже можно."],
  otlichnitsa:["Для неё это провал. Ночью она не спит и прокручивает: «Я ни на что не гожусь».","Одно замечание перечеркнуло все её успехи.","Аня говорит себе: «Замечание к отчёту – не оценка меня». И спокойно переделывает."],
  nevidimka:["Аня кивает с каменным лицом. Никто не видит, как ей обидно.","Обида уходит внутрь и превращается в усталость.","Вечером Аня рассказывает мужу, как ей было неприятно. Становится легче."],
  chutkaya:["Весь день она следит за начальником: он злится? Её уволят?","Работать невозможно: всё внимание ушло на радар.","Аня спрашивает у начальника, есть ли ещё замечания, вместо того чтобы гадать."],
  opora:["«Поняла. Что нужно поправить?» Ей неприятно, но это не катастрофа.","Ошибка в работе для неё – просто ошибка.","Аня полночи переделывает отчёт и ругает себя. Утром замечает это и говорит себе: «Это просто замечание, а не оценка меня»."]}},
 {group:"mom", who:"С дочкой", title:"Сок на диване", text:"Дочка разлила сок на новый диван.", by:{
  udobnaya:["Аня срывается, а потом весь вечер извиняется и задаривает дочку, чтобы та не обижалась.","Она боится, что из-за одной вспышки дочка её разлюбит.","«Я рассердилась. Давай вместе уберём». Без крика и без вины."],
  silnaya:["«Отойди, я сама». Аня молча отмывает диван.","Дочка учится тому же: с бедой справляются в одиночку.","«Неси тряпку, будем отмывать вдвоём». Помогать друг другу – нормально."],
  otlichnitsa:["«Ну сколько можно! Руки-крюки!» Слова вылетают сами, точь-в-точь как когда-то у её мамы.","История повторяется. Дочка делает свой вывод о мире.","Аня замечает: «Я сейчас говорю мамиными словами». И останавливается."],
  nevidimka:["Аня ничего не говорит, только вздыхает и уходит за тряпкой.","Дочка не понимает, злится мама или нет, и чувствует себя виноватой.","«Я расстроилась. Но это просто сок. Давай уберём»."],
  chutkaya:["Первая мысль: что скажет муж? Надо срочно отмыть, пока он не увидел.","Дочка видит мамин страх и учится бояться тоже.","Аня выдыхает: «Ничего страшного не случилось». И это правда."],
  opora:["«Ой! Бывает. Давай вместе уберём». Сок отмывается, а дочка запоминает: ошибаться не страшно.","Она передаёт дочке то, что когда-то получила сама.","Аня срывается на дочку. Через минуту садится рядом: «Прости, я накричала. Давай уберём вместе»."]}},

 /* ––– Отношения: ещё две ситуации с мужем ––– */
 {group:"rel", who:"С мужем", title:"Забытая дата", text:"Сегодня годовщина их знакомства. Уже вечер, а он, кажется, забыл.", by:{
  udobnaya:["Аня ничего не говорит: не хочет, чтобы он чувствовал себя виноватым. И убеждает себя, что это неважно.","Важное для неё снова стало неважным. Обида тихо оседает внутри.","Аня говорит: «Сегодня наша дата. Мне хотелось, чтобы ты вспомнил». Без упрёка, просто о себе."],
  silnaya:["Она сама покупает себе цветы и торт. Праздновать можно и без него.","Праздник есть, а близости нет.","Аня говорит: «Мне важно отметить это вдвоём. Давай закажем ужин?»"],
  otlichnitsa:["Аня думает: значит, она стала неинтересной. Надо больше стараться, лучше выглядеть.","Его забывчивость она превращает в оценку себя.","Аня отделяет одно от другого: «Он забыл дату. Это не значит, что я плохая». И напоминает ему."],
  nevidimka:["Она молча ложится спать пораньше. «Всё нормально, просто устала».","Он так и не понял, что что-то случилось.","Аня говорит: «Мне грустно, что ты забыл». Ему неловко, и он её обнимает."],
  chutkaya:["Она начинает подозревать: может, он охладел? Может, у него кто-то есть? Ночь без сна.","Одна забытая дата превращается внутри в катастрофу.","Аня спрашивает его прямо, а не додумывает. Он просто замотался на работе."],
  opora:["«Эй, а ты помнишь, какой сегодня день?» Они смеются, и он бежит за тортом.","Его забывчивость не ставит под сомнение их любовь.","Аня весь вечер молча дуется. Перед сном говорит: «Мне было грустно, что ты забыл. Давай отметим завтра»."]}},
 {group:"rel", who:"С мужем", title:"Его пятница", text:"Муж говорит: «В пятницу я с друзьями на футбол, вернусь поздно».", by:{
  udobnaya:["«Конечно, иди». Хотя ей хотелось провести пятницу вместе.","Он ушёл довольный. Она осталась с невысказанным желанием.","«Иди. А в субботу давай побудем вдвоём, мне это важно»."],
  silnaya:["«Иди, мне всё равно». Она планирует свой вечер так, будто его нет.","Каждый живёт сам по себе. Как будто так и надо.","Аня говорит: «Я буду скучать». Признаться в этом непривычно."],
  otlichnitsa:["Она думает: раз ему нужны друзья, значит, со мной скучно. Надо стать интереснее.","Его свободу она воспринимает как оценку себя.","Аня вспоминает: у него может быть своя жизнь, и это не про её ценность. И планирует пятницу для себя."],
  nevidimka:["Она кивает, а весь вечер пятницы ходит обиженная и молчит.","Он возвращается и чувствует холод. Не понимает почему.","Аня говорит: «Мне немного обидно, что пятница без тебя». Им есть что обсудить."],
  chutkaya:["Её начинает тревожить: а точно футбол? С кем? Она пишет ему весь вечер.","Вечер проходит в тревоге, а он чувствует контроль.","Аня замечает тревогу и занимает вечер собой: ванна, книга, звонок подруге. Тревога становится тише."],
  opora:["«Хорошо, отдохни. А я позову подругу». Ей нравится, что у каждого есть что-то своё.","Отдельность не угрожает их близости.","Аня обижается и весь вечер проверяет телефон. Потом говорит себе: «Я скучаю, и это нормально». И звонит подруге."]}},

 /* ––– Материнство ––– */
 {group:"mom", who:"С дочкой", title:"Истерика в магазине", text:"Дочка рыдает и кричит на весь магазин: хочет игрушку. Люди оборачиваются.", by:{
  udobnaya:["Аня покупает игрушку, лишь бы все перестали смотреть.","Сегодня тихо. Но обе запомнили: главное, чтобы люди не осуждали.","Аня присаживается к дочке: «Ты очень её хочешь. Я понимаю. Но сегодня не купим». И выдерживает взгляды."],
  silnaya:["Аня молча берёт дочку на руки и выносит, ни на кого не глядя. Она справится.","Она справилась. Но внутри осталась одна со стыдом и злостью.","Дома Аня рассказывает мужу, как ей было тяжело. Не нужно проживать это одной."],
  otlichnitsa:["Аня горит от стыда: все видят, какая она плохая мать.","Истерика дочки стала для неё двойкой за материнство.","Аня говорит себе: «Это не экзамен. Дети плачут, и это нормально»."],
  nevidimka:["Аня делает каменное лицо и шипит: «Прекрати немедленно».","Дочка учится тому, что сильные чувства надо прятать.","Аня обнимает дочку: «Ты злишься и расстроена. Я рядом»."],
  chutkaya:["Аня ловит каждый взгляд вокруг: кто осуждает, кто что подумал.","Всё внимание уходит на чужих людей. На дочку и на себя его не остаётся.","Аня поворачивается спиной к залу и смотрит только на дочку."],
  opora:["«Ты очень хочешь эту игрушку. Давай запишем её в список на день рождения». Чужие взгляды её почти не трогают.","Её материнство не зависит от одобрения посторонних.","Аня от стыда покупает игрушку. Дома говорит себе: «Я устала, так бывает. В следующий раз попробую иначе»."]}},
 {group:"mom", who:"С сыном", title:"Сообщение от учительницы", text:"Учительница пишет в родительский чат: «Ваш сын опять не сделал домашнее задание».", by:{
  udobnaya:["Аня тут же отвечает: «Извините, пожалуйста, больше не повторится!»","Она извиняется за сына, как когда-то извинялась за себя.","Аня спокойно отвечает учительнице, а потом спрашивает сына, что случилось."],
  silnaya:["Вечером Аня сама садится с сыном и делает все уроки на неделю вперёд.","Уроки сделаны. Но теперь это её задача, а не его.","Аня договаривается с мужем, чтобы он тоже следил за уроками. Не всё на ней."],
  otlichnitsa:["«Почему ты меня позоришь?!» Она проверяет каждую тетрадь до ночи.","Оценки сына стали её оценками. Как когда-то её пятёрки были маминой гордостью.","Аня вспоминает себя в восемь лет. И спрашивает: «Что было трудным? Давай разберёмся»."],
  nevidimka:["Аня ничего не говорит сыну, но весь вечер с ним холодна.","Сын не понимает, что не так, и чувствует себя плохим.","Аня говорит прямо: «Я расстроилась из-за сообщения учительницы. Давай поговорим»."],
  chutkaya:["Аня в тревоге: что теперь подумают в школе? Вдруг сына будут считать плохим?","Её тревога передаётся сыну, и уроки становятся ещё страшнее.","Аня выдыхает: это одно задание, не катастрофа. И говорит с сыном спокойно."],
  opora:["«Учительница написала про домашку. Что случилось?» Они вместе ищут, как быть.","Ошибки сына для неё повод помочь, а не повод стыдиться.","Аня сгоряча отчитывает сына. Потом приходит к нему: «Я погорячилась. Давай разберёмся, что случилось»."]}},
 {group:"mom", who:"С дочкой", title:"«Поиграй со мной»", text:"Вечер. Аня без сил после работы. Дочка тянет её за руку: «Мама, поиграй со мной!»", by:{
  udobnaya:["Аня играет через силу, улыбается и злится на себя за то, что злится.","Игра без радости. И дочка это чувствует.","«Я очень устала. Давай я полежу, а ты расскажешь мне сказку?» Так можно быть рядом и отдыхать."],
  silnaya:["«Иди поиграй сама». Аня уходит на кухню доделывать дела.","Она снова тянет всё одна, а дочка остаётся одна.","Аня просит мужа поиграть с дочкой, а сама отдыхает двадцать минут. Потом присоединяется."],
  otlichnitsa:["Ей стыдно: хорошая мама должна играть всегда. И она ещё придумывает развивающую игру.","Её усталость не считается. Есть только норма хорошей мамы.","Аня разрешает себе: «Я неидеальная мама. Сегодня десяти минут достаточно»."],
  nevidimka:["Аня сидит рядом, но смотрит в телефон.","Она рядом телом, но её нет. Дочка это чувствует.","«Я устала, но хочу побыть с тобой. Давай во что-нибудь тихое?»"],
  chutkaya:["Аня видит, что дочка может расстроиться, и боится этого больше, чем своей усталости.","Чужие слёзы для неё страшнее собственного бессилия.","Аня отказывает и выдерживает дочкино недовольство. Через минуту дочка уже играет сама."],
  opora:["«Я очень устала. Давай десять минут поиграем, а потом я отдохну». Дочка соглашается.","Можно заботиться о ребёнке и о себе одновременно.","Аня раздражённо отвечает: «Отстань». Потом обнимает дочку: «Прости, я очень устала. Давай я полежу, а ты посидишь рядом»."]}},
 {group:"mom", who:"Со свекровью", title:"«Ты её балуешь»", text:"Свекровь в гостях смотрит, как Аня обнимает плачущую дочку: «Ты слишком её балуешь. Мы своих так не растили».", by:{
  udobnaya:["Аня кивает: «Да, вы правы». Хотя думает иначе.","В собственном доме её мнение опять не считается.","«Спасибо, я подумаю. Но у нас свой подход». Вежливо и твёрдо."],
  silnaya:["Аня молчит, а про себя решает больше никогда ни о чём свекровь не просить.","Ещё одна дверь, через которую могла прийти помощь, закрылась.","Аня говорит мужу: «Мне нужна твоя поддержка в этом». Она не одна против всех."],
  otlichnitsa:["Аня начинает сомневаться: может, она и правда плохая мать?","Чужое мнение снова стало приговором.","Аня напоминает себе: «Я знаю своего ребёнка. Я делаю достаточно хорошо»."],
  nevidimka:["Аня улыбается, а весь вечер внутри кипит. Ни слова.","Злость остаётся в теле и потом выходит на мужа или детей.","Аня спокойно говорит: «Мне неприятно это слышать»."],
  chutkaya:["Весь визит Аня следит за свекровью: довольна ли? не раздражается ли?","Визит проходит в напряжении. После него Аня выжата.","Аня отпускает задачу всем угодить: её дом, её правила."],
  opora:["«Я понимаю, у вас был свой опыт. А у нас по-другому». Без войны и без подчинения.","Она может слышать чужое мнение и оставаться при своём.","Аня молча кивает, а потом весь вечер злится. Перед сном говорит мужу, что ей было неприятно, и просит его поддержки."]}},
 {group:"mom", who:"С сыном", title:"Хлопнувшая дверь", text:"Сыну 14. Он хлопает дверью: «Ты ничего не понимаешь! Отстань!»", by:{
  udobnaya:["Аня идёт следом и извиняется: «Прости, я не хотела».","Она снова отвечает за чужую злость.","Аня даёт сыну остыть. Потом стучит: «Я рядом, когда захочешь поговорить»."],
  silnaya:["«Ну и ладно». Она уходит в свои дела.","Между ними растёт стена.","Аня признаётся мужу: «Мне больно, когда он так». И просит совета."],
  otlichnitsa:["Аня думает: я провалилась как мать. Что я сделала не так?","Подростковая злость сына стала её двойкой.","Аня вспоминает: в 14 лет злиться и закрываться нормально. Это не оценка её материнства."],
  nevidimka:["Аня делает вид, что ничего не произошло. Ужинают молча.","Сын учится тому же: о трудном не говорят.","Позже Аня говорит: «Меня задели твои слова. Давай поговорим, когда будешь готов»."],
  chutkaya:["Аня прислушивается к каждому звуку из его комнаты и не находит себе места.","Её тревога заполняет весь дом.","Аня напоминает себе: «Он злится, но мы в безопасности. Это пройдёт»."],
  opora:["«Похоже, тебе очень плохо. Я на кухне, если что». Она не уходит и не давит.","Злость сына не разрушает их связь.","Аня кричит в ответ. Потом стучится к сыну: «Я тоже сорвалась. Давай попробуем поговорить ещё раз»."]}},
 {group:"mom", who:"С дочкой", title:"«Я тебя не люблю!»", text:"Аня не разрешила дочке смотреть мультики. Та кричит: «Я тебя не люблю! Ты плохая мама!»", by:{
  udobnaya:["Аня сразу включает мультик. Лишь бы дочка снова её любила.","Дочка запоминает: этими словами можно управлять мамой.","«Ты злишься на меня. Я всё равно тебя люблю. Мультик завтра»."],
  silnaya:["«Ну и не люби». Аня отворачивается к своим делам.","Обе остаются одни со своей обидой.","Аня садится рядом: «Мне грустно это слышать. Давай помиримся»."],
  otlichnitsa:["Слова дочки попадают в самое больное: «Я плохая мать».","Детская фраза превращается в приговор.","Аня понимает: это злость, а не оценка. Дети так говорят, когда им что-то нельзя."],
  nevidimka:["Аня молча выходит из комнаты. Внутри больно.","Дочка не знает, что мама расстроилась, и чувствует холод.","«Мне обидно. И я тебя люблю». Можно сказать сразу оба чувства."],
  chutkaya:["Аня в панике: вдруг дочка правда её разлюбит?","Она уступает, чтобы унять собственный страх.","Аня дышит и вспоминает: любовь ребёнка не исчезает от одного «нельзя»."],
  opora:["«Ты очень злишься, что нельзя. Я понимаю. И я тебя люблю». Она остаётся спокойной.","Детская злость не пугает её и не разрушает любовь.","Аня обижается и замолкает. Через пару минут возвращается: «Мне было больно это слышать. И я всё равно тебя люблю»."]}},
 {group:"mom", who:"С детьми", title:"Вечер для себя", text:"Подруги зовут Аню в кафе в пятницу. Муж говорит: «Иди, я посижу с детьми».", by:{
  udobnaya:["«Нет, как же я их оставлю». Она остаётся дома.","Она опять отказалась от себя ради всех.","Аня соглашается и идёт. Немного вины есть, но и радость тоже."],
  silnaya:["Аня идёт, но перед этим сама готовит ужин на два дня, купает детей и пишет мужу инструкцию.","Даже отдых она отрабатывает заранее.","Аня доверяет мужу: «Справитесь». И уходит налегке."],
  otlichnitsa:["Она думает: хорошая мать не бросает детей ради кафе.","Отдых снова нужно заслужить.","Аня говорит себе: «Отдохнувшая мама – тоже хорошая мама»."],
  nevidimka:["Она отказывается, ничего не объясняя, и весь вечер грустит.","Никто не знает, как ей хотелось пойти.","Аня говорит мужу: «Мне очень хочется пойти». И идёт."],
  chutkaya:["В кафе она каждые пятнадцать минут проверяет телефон: всё ли дома в порядке?","Тело в кафе, а внимание дома.","Аня убирает телефон в сумку: если что-то случится, муж позвонит."],
  opora:["«Спасибо! Иду». Она проводит вечер с подругами и возвращается отдохнувшей.","Забота о себе не отнимает у детей маму.","Аня отказывается и весь вечер сидит дома с чувством вины. Потом замечает это и договаривается с подругами на следующую пятницу."]}},

 /* ––– Работа ––– */
 {group:"work", who:"С коллегой", title:"Чужая задача", text:"Коллега подходит к Ане: «Возьмёшь мою задачу? Ты же быстро сделаешь, а у меня завал».", by:{
  udobnaya:["«Конечно!» Хотя у неё своих задач на неделю.","Она снова задерживается допоздна с чужой работой.","«Сейчас не смогу, у меня своя срочная задача». Коллега кивает и идёт к другому."],
  silnaya:["Аня берёт задачу и не говорит, что ей тоже тяжело.","Все знают: Аня вытянет. И кладут на неё всё больше.","Аня говорит: «Я тоже в завале. Давай попросим помощи у руководителя»."],
  otlichnitsa:["Она берёт задачу и делает её даже лучше своей, чтобы все видели, какая она ценная.","Её ценят за полезность. И она снова выгорает.","Аня вспоминает: её ценность не измеряется количеством задач. И отказывается."],
  nevidimka:["Она молча соглашается, а потом злится весь день.","Коллега не знает, что Аня злится, и попросит снова.","Аня говорит как есть: «Мне неловко отказывать, но я не успею»."],
  chutkaya:["Аня думает: если откажу, коллега обидится и будет хуже ко мне относиться.","Она платит своим временем за чужое хорошее настроение.","Аня отказывает. И видит: коллега, кажется, вообще не обиделся."],
  opora:["«Сегодня не могу. В четверг помогу с частью». Ей не нужно спасать всех.","Её «нет» никого не разрушает.","Аня соглашается взять чужую задачу. Через час возвращается к коллеге: «Извини, я поторопилась. Не успею»."]}},
 {group:"work", who:"С начальником", title:"Новый проект", text:"Начальник предлагает Ане возглавить новый большой проект.", by:{
  udobnaya:["«Если вы считаете, что надо, конечно». Хочет ли она сама, Аня даже не спрашивает себя.","Она снова делает то, чего ждут другие.","«Можно я подумаю до завтра?» И Аня спрашивает себя: а мне это интересно?"],
  silnaya:["Она соглашается и решает всё вытянуть одна, без команды.","Новый проект становится ещё одним грузом на её плечах.","Аня соглашается с условием: «Мне нужен помощник»."],
  otlichnitsa:["Аня в ужасе: вдруг не справится и все увидят, что она не так уж хороша?","Она отказывается, чтобы не рисковать ошибкой.","Аня говорит себе: «Можно учиться по ходу. Ошибки – часть пути». И соглашается."],
  nevidimka:["Аня не показывает ни радости, ни страха: «Хорошо».","Никто не знает, что ей страшно. И помощи она не получит.","Аня говорит: «Мне приятно и немного страшно. Можно обсудить, как это будет?»"],
  chutkaya:["Она пытается угадать, чего хочет начальник: проверяет её? ждёт отказа?","Решение принято не по её желанию, а по чужому лицу.","Аня спрашивает прямо: «Почему вы выбрали меня?»"],
  opora:["«Спасибо, мне интересно. Давайте обсудим, что для этого нужно». Ей и страшно, и радостно.","Страх перед новым не заставляет её отказаться от себя.","Аня от страха сразу отказывается. На следующий день приходит к начальнику: «Я подумала. Мне интересно, давайте обсудим»."]}},
 {group:"work", who:"На совещании", title:"Чужая заслуга", text:"На совещании Аня предложила идею, её не услышали. Через десять минут коллега говорит то же самое, и все его хвалят.", by:{
  udobnaya:["Аня молчит: неудобно поднимать шум.","Её вклад снова невидим.","Аня говорит: «Рада, что идея понравилась. Я предлагала её в начале встречи»."],
  silnaya:["«Ладно. В следующий раз сделаю всё сама, и никто не присвоит».","Она замыкается и перестаёт делиться идеями.","После совещания Аня говорит руководителю, что идея её, и просит поддержки."],
  otlichnitsa:["Она думает: значит, я плохо объяснила. Надо было лучше.","Чужую несправедливость она записывает себе в ошибки.","Аня понимает: дело не в ней. И спокойно говорит о своём авторстве."],
  nevidimka:["Аня опускает глаза и больше не говорит на совещании.","Её всё меньше слышно.","Аня поднимает руку: «Хочу добавить к своей идее…»"],
  chutkaya:["Она всматривается в лица: может, все против неё? Может, её не уважают?","Тревога забирает силы, а ситуация остаётся прежней.","Аня спокойно обсуждает это с коллегой после встречи."],
  opora:["«Да, это продолжение моей идеи из начала. Давайте я расскажу подробнее». Без обиды и без молчания.","Она знает цену своему вкладу.","Аня промолчала на совещании. После встречи она всё-таки подходит к руководителю и говорит, что идея была её."]}},
 {group:"work", who:"С начальником", title:"Пятница, 18:00", text:"Пятница, конец дня. Начальник пишет: «Нужно срочно доделать к понедельнику».", by:{
  udobnaya:["«Конечно, сделаю!» Выходные с семьёй отменяются.","Работа снова важнее её жизни.","«Смогу сделать в понедельник к обеду». Выходные остаются её."],
  silnaya:["Аня молча садится работать на все выходные.","Никто не знает, чего ей это стоило.","Аня пишет: «Одна не успею. Нужен кто-то в помощь»."],
  otlichnitsa:["Она делает всё идеально и даже больше, чем просили.","Её хвалят, а к понедельнику у неё нет сил.","Аня делает достаточно хорошо и в субботу вечером закрывает ноутбук."],
  nevidimka:["Аня соглашается без слов, а вечером срывается дома на детей.","Злость выходит не туда, куда нужно.","Аня пишет начальнику, что выходные у неё заняты, и предлагает другой срок."],
  chutkaya:["Она гадает: это проверка? Если откажу, меня уволят?","Страх решает за неё.","Аня уточняет: «Насколько это срочно? Что будет, если сделать в понедельник?»"],
  opora:["«У меня планы на выходные. Сделаю в понедельник к двенадцати». Начальник соглашается.","Работа для неё часть жизни, а не вся жизнь.","Аня соглашается и садится работать. Через час останавливается и пишет: «Смогу сделать в понедельник к обеду»."]}},
 {group:"work", who:"С начальником", title:"Разговор о зарплате", text:"Аня давно хочет попросить прибавку. Сегодня встреча с руководителем.", by:{
  udobnaya:["Аня так и не поднимает тему: неудобно, вдруг подумают, что она жадная.","Ещё год работы за прежние деньги.","Аня говорит: «Я хочу обсудить свою зарплату». Голос дрожит, но она говорит."],
  silnaya:["Она решает, что проще найти подработку, чем просить.","Она снова берёт всё на себя вместо того, чтобы попросить.","Аня просит. Оказывается, просить не стыдно."],
  otlichnitsa:["Аня готовит презентацию на двадцать слайдов со всеми своими успехами, чтобы доказать, что заслужила.","Даже деньги ей нужно заслужить идеальностью.","Аня говорит коротко: «У меня стало больше обязанностей. Хочу, чтобы это отразилось в зарплате»."],
  nevidimka:["На встрече Аня говорит обо всём, кроме денег.","Её желание остаётся невысказанным.","Аня называет сумму. Вслух."],
  chutkaya:["Она смотрит на руководителя: настроение плохое, значит, не сегодня.","Подходящий момент так и не наступает.","Аня решает говорить не по его настроению, а по своему решению."],
  opora:["«Я хочу обсудить повышение. Вот что я сделала за год». Она готова к любому ответу.","Её ценность не зависит от его ответа.","Аня так и не решается поднять тему. Вечером пишет руководителю: «Хочу обсудить свою зарплату. Когда вам удобно?»"]}},
 {group:"work", who:"С коллегами", title:"Обед без неё", text:"Коллеги ушли обедать вместе. Аню не позвали.", by:{
  udobnaya:["Аня решает: надо быть ещё милее и полезнее, тогда позовут.","Она старается понравиться всем и устаёт.","В следующий раз Аня сама говорит: «Можно с вами?»"],
  silnaya:["«И не надо. Я и одна прекрасно пообедаю».","Одиночество становится привычным.","Аня сама зовёт одну из коллег на обед."],
  otlichnitsa:["Аня думает: со мной скучно, я недостаточно интересная.","Случайность стала доказательством того, что она «недостаточно хороша».","Аня допускает, что это просто случайность, а не оценка."],
  nevidimka:["Аня ест за компьютером и делает вид, что ей всё равно.","Её всё меньше замечают.","Аня говорит коллеге: «Мне было обидно, что вы ушли без меня»."],
  chutkaya:["Она перебирает: может, они на неё злятся? Что она сказала не так?","Весь день уходит на разгадывание.","В следующий раз Аня просто спрашивает: «Вы на обед? Я с вами»."],
  opora:["Аня немного грустит, а потом говорит коллегам: «В следующий раз зовите меня».","Одна случайность не задевает её надолго.","Аня весь день молча обижается. На следующий день сама говорит коллегам: «Возьмёте меня с собой?»"]}},
 {group:"work", who:"С клиентом", title:"Ошибка", text:"Аня ошиблась в расчётах, и клиент недоволен. Нужно сказать руководителю.", by:{
  udobnaya:["Аня извиняется так много, что руководителю становится неловко.","Она берёт на себя больше вины, чем было.","«Я ошиблась. Вот как я это исправлю». Без лишних извинений."],
  silnaya:["Аня никому не говорит и ночью сама всё исправляет.","Ошибка исправлена, но она опять одна.","Аня говорит руководителю и просит помочь с клиентом."],
  otlichnitsa:["Аня не спит ночью: одна ошибка перечёркивает всё, что она сделала.","Стыд мешает ей думать о решении.","Аня говорит себе: «Ошибаются все. Я – не моя ошибка»."],
  nevidimka:["Аня тянет время и надеется, что никто не заметит.","Проблема растёт.","Аня сразу говорит: «Мне неприятно, но я должна сказать: я ошиблась»."],
  chutkaya:["Она представляет худшее: крик, увольнение. И откладывает разговор.","Чем дольше она ждёт, тем страшнее.","Аня идёт к руководителю сразу. Он реагирует спокойнее, чем она боялась."],
  opora:["«Я ошиблась в расчётах. Уже знаю, как исправить». Ей неприятно, но не стыдно.","Ошибка не меняет её отношения к себе.","Аня полдня тянет с признанием. Потом идёт к руководителю: «Я ошиблась. Вот как я это исправлю»."]}},
 /* ––– Отношения: добавлено ––– */
 {group:"rel", who:"С мужем", title:"Решение без неё", text:"Муж говорит: «Я уже договорился: на Новый год едем к моим родителям».", by:{
  udobnaya:["«Хорошо, как скажешь». Хотя Аня мечтала встретить праздник дома.","Решение принято без неё, и она сама помогла этого не заметить.","Аня говорит: «Мне важно, чтобы такие решения мы принимали вместе. Давай обсудим»."],
  silnaya:["«Езжайте. Я сама решу, где мне встречать». Она молча строит свои планы.","Они всё дальше друг от друга, хотя оба этого не хотели.","Аня говорит: «Мне обидно, что ты решил без меня. Я хочу участвовать»."],
  otlichnitsa:["Аня начинает готовиться: подарки всем родственникам, салаты, идеальное платье. Свекровь должна быть довольна.","Праздник превращается в проверку, которую надо сдать на отлично.","Аня соглашается поехать, но решает ничего не доказывать: просто быть гостьей."],
  nevidimka:["Аня кивает и замолкает на весь вечер.","Муж думает, что она согласна. А внутри у неё копится обида.","Аня говорит: «Подожди. Я расстроилась. Мне хотелось другого»."],
  chutkaya:["Она видит, что муж уже настроился, и боится спорить: вдруг поссорятся перед праздником?","Чтобы не было ссоры, она отказывается от своего желания.","Аня рискует сказать о своём желании. Ссоры не случается: они ищут вариант вместе."],
  opora:["«Подожди, давай решим вместе. Я хотела бы встретить Новый год дома. Может, к родителям поедем второго?»","Её голос в семье звучит наравне с его.","Аня молча соглашается. Через день возвращается к разговору: «Мне важно, чтобы мы решали вместе»."]}},
 {group:"rel", who:"С подругой", title:"Чужой успех", text:"Подруга радостно рассказывает: её повысили, и они с мужем купили квартиру.", by:{
  udobnaya:["Аня поздравляет и весь вечер расспрашивает подругу. О своих делах молчит.","Внутри неприятно колет, но Аня делает вид, что всё отлично.","Аня признаётся себе: «Я рада за неё. И мне немного завидно». Обе правды могут быть рядом."],
  silnaya:["«Молодец». А дома Аня думает: «Мне никто не помогает, я всего добиваюсь сама».","Зависть превращается в одиночество: она снова одна против всего мира.","Аня спрашивает подругу: «А как ты к этому пришла?» И узнаёт, что подруге тоже помогали."],
  otlichnitsa:["Аня сравнивает: у подруги повышение, а у неё ничего. Значит, она отстаёт.","Чужая радость стала для неё двойкой.","Аня вспоминает: жизнь – не соревнование. И спрашивает себя, чего хочет она сама."],
  nevidimka:["Аня улыбается и быстро переводит разговор. Зависть ей стыдно даже замечать.","Чувство спрятано, но портит ей настроение на несколько дней.","Аня замечает: «Мне завидно. Значит, я тоже чего-то хочу». Это подсказка, а не стыд."],
  chutkaya:["Аня следит, чтобы подруга не заметила её реакции. Вдруг решит, что Аня не рада?","Весь разговор уходит на контроль лица. Радоваться некогда.","Аня перестаёт следить за собой и просто слушает подругу."],
  opora:["«Как здорово! Я рада за тебя». А потом думает: «Мне тоже хочется перемен. С чего бы начать?»","Чужой успех её вдохновляет, а не обесценивает.","Аня весь вечер сравнивает себя с подругой и грустит. Утром замечает зависть и спрашивает себя: «А чего хочу я?»"]}},
 /* ––– Материнство: добавлено ––– */
 {group:"mom", who:"С сыном", title:"«Я больше не хочу»", text:"Сын третий год ходит на футбол и вдруг говорит: «Я больше не хочу».", by:{
  udobnaya:["«Мы столько денег заплатили! Тренер расстроится». Аня уговаривает сына остаться.","Она повторяет то, что когда-то слышала сама: чужие ожидания важнее своего «не хочу».","Аня спрашивает: «Что случилось? Почему расхотелось?» И слушает."],
  silnaya:["«Решай сам, ты уже большой». Аня не вникает: у неё своих дел хватает.","Сын остаётся один со своим решением, как когда-то она.","Аня садится рядом: «Давай подумаем вместе. Я помогу тебе решить»."],
  otlichnitsa:["«Бросают только слабаки. Доиграешь сезон». Аня боится, что сын вырастет неудачником.","Сын учится, что сдаваться нельзя, даже когда плохо.","Аня вспоминает себя в девять лет. И говорит: «Можно попробовать что-то другое»."],
  nevidimka:["«Как хочешь», – отвечает Аня и утыкается в телефон.","Сын не понимает, важен ли он маме.","Аня откладывает телефон: «Расскажи, мне правда интересно»."],
  chutkaya:["Аня тревожится: что скажет муж? Что подумают другие родители?","Решение принимается по чужому мнению, а не по сыну.","Аня решает думать о сыне, а не о том, что скажут люди."],
  opora:["«Расскажи, что тебе разонравилось. А что хотелось бы вместо?» Они вместе ищут, как быть.","Она даёт сыну то, чего когда-то не хватало ей.","Аня по привычке говорит: «Доиграй сезон». Потом спохватывается и спрашивает сына, что случилось."]}},
 {group:"mom", who:"С дочкой", title:"Ночные страхи", text:"Ночью дочка в третий раз приходит в спальню: «Мама, мне страшно».", by:{
  udobnaya:["Аня ложится с дочкой и засыпает в неудобной позе. Лишь бы не плакала.","Утром Аня разбитая. Свой сон у неё всегда на последнем месте.","Аня включает ночник, сидит рядом пять минут и говорит: «Я рядом, в соседней комнате»."],
  silnaya:["«Ты уже большая. Иди спать сама». Аня отворачивается.","Дочка учится справляться со страхом одна, как когда-то Аня.","Аня встаёт, провожает дочку и сидит рядом, пока та не успокоится."],
  otlichnitsa:["«Большие девочки не боятся темноты». Аня хочет, чтобы дочка была смелой.","Дочка учится стыдиться своего страха.","Аня говорит: «Бояться нормально. Давай придумаем, что тебе поможет»."],
  nevidimka:["«Хватит выдумывать, спи». Аня даже не открывает глаза.","Страх дочки остаётся без ответа, как когда-то её собственный.","Аня просыпается по-настоящему: «Чего ты боишься? Расскажи»."],
  chutkaya:["Аня сама пугается: вдруг с дочкой что-то не так? Она полночи читает статьи о детских страхах.","Её тревога становится больше дочкиного страха.","Аня дышит и напоминает себе: детские страхи – это нормально. И просто обнимает дочку."],
  opora:["«Тебе страшно. Давай включим ночник, и я посижу с тобой». Через десять минут дочка спит.","Она может успокоить ребёнка и не потерять себя.","Аня спросонья отвечает резко: «Иди спать!» Потом встаёт, включает ночник и садится рядом."]}},
 {group:"mom", who:"С другой мамой", title:"Замечание на площадке", text:"На детской площадке незнакомая мама резко говорит Ане: «Ваш сын толкает мою дочку! Следите за ребёнком!»", by:{
  udobnaya:["Аня краснеет, много раз извиняется и при всех отчитывает сына.","Чужая мама довольна. А сын запомнил, что мама не на его стороне.","Аня спокойно говорит: «Я разберусь». И сначала спрашивает сына, что случилось."],
  silnaya:["Аня молча уводит сына с площадки. Она сама разберётся, без чужих советов.","Ситуация не прояснилась, а внутри осталась злость.","Аня говорит: «Давайте спросим у детей, что произошло»."],
  otlichnitsa:["Аня в ужасе: все видят, что она плохая мать и не умеет воспитывать.","Одно замечание перечеркнуло всю её заботу о сыне.","Аня напоминает себе: дети толкаются, это не оценка её материнства."],
  nevidimka:["Аня делает вид, что не услышала, и смотрит в сторону.","Конфликт висит в воздухе, а сын не понимает, что сделал не так.","Аня отвечает: «Спасибо, что сказали. Я поговорю с сыном»."],
  chutkaya:["Аня ловит взгляды других мам: кто что подумал? Дальше гулять она уже не может.","Прогулка испорчена чужим мнением.","Аня решает: важнее, что чувствует её сын, чем что думают люди."],
  opora:["«Давайте разберёмся. Сынок, что случилось?» Аня спокойна и внимательна к обоим детям.","Чужое недовольство не выбивает её из равновесия.","Аня при всех отчитывает сына. Дома извиняется перед ним и спрашивает, что было на самом деле."]}},
 {group:"mom", who:"С сыном", title:"«Не позорь меня»", text:"Сын просит: «Мам, не провожай меня до школы. Не позорь меня перед ребятами».", by:{
  udobnaya:["«Хорошо, конечно». А потом весь день чувствует себя ненужной.","Она соглашается, но обида остаётся внутри.","Аня говорит: «Хорошо. Мне немного грустно, но я понимаю, что ты растёшь»."],
  silnaya:["«Ну и ладно». Аня решает больше ни о чём сына не спрашивать.","Между ними появляется холод, хотя сын просто взрослеет.","Аня говорит: «Договорились. А вечером расскажешь, как прошёл день?»"],
  otlichnitsa:["Аня думает: «Что со мной не так? Я плохо выгляжу? Я неправильная мама?»","Взросление сына стало для неё оценкой.","Аня напоминает себе: сын отделяется, потому что растёт, а не потому что она плохая."],
  nevidimka:["Аня молча кивает и больше не заводит разговор.","Сын не знает, задел ли он маму.","Аня говорит: «Мне чуть-чуть грустно. Но я рада, что ты становишься самостоятельным»."],
  chutkaya:["Аня тревожится: вдруг с ним что-то случится по дороге? Тайком смотрит из окна.","Её тревога мешает сыну расти.","Аня договаривается: «Напиши, когда дойдёшь». И отпускает."],
  opora:["«Конечно. Ты уже взрослый». Ей немного грустно, и она это себе разрешает.","Она может отпустить сына и остаться с ним близкой.","Аня обижается и весь день ходит грустная. Вечером говорит сыну: «Мне было немного грустно, но я рада, что ты растёшь»."]}},
 /* ––– Работа: добавлено ––– */
 {group:"work", who:"С коллегами", title:"Тост на корпоративе", text:"На корпоративе начальник неожиданно просит Аню сказать несколько слов от всего отдела.", by:{
  udobnaya:["Аня соглашается, хотя ей очень страшно. Отказывать неудобно.","Она говорит, а внутри всё дрожит. Себя она не спросила.","Аня говорит: «Я не готова сейчас. Давайте лучше кто-то другой»."],
  silnaya:["Аня берёт микрофон и говорит, сжав зубы. Справится сама.","Справилась. Но никто не знает, чего ей это стоило.","Аня зовёт коллегу: «Давай скажем вместе»."],
  otlichnitsa:["Аня в панике: речь должна быть идеальной, а подготовиться нельзя.","Она весь вечер прокручивает, что сказала не так.","Аня говорит пару простых тёплых фраз. И этого оказывается достаточно."],
  nevidimka:["Аня краснеет, бормочет «спасибо всем» и быстро садится.","Её почти не услышали. Так ей привычнее.","Аня делает вдох и говорит то, что чувствует: «Мне правда с вами хорошо работается»."],
  chutkaya:["Пока Аня говорит, она следит за лицами: им скучно? смешно? что-то не так?","Она не слышит саму себя, только чужую реакцию.","Аня смотрит на одного доброжелательного коллегу и говорит для него."],
  opora:["«Ой, неожиданно! Но скажу», – и говорит коротко и от души.","Волнение есть, но оно ею не управляет.","Аня скомканно бормочет пару слов и садится. Потом говорит себе: «Я волновалась, и это нормально»."]}},
 {group:"work", who:"С начальником", title:"Похвала при всех", text:"На общем собрании начальник говорит: «Отдельное спасибо Ане. Без неё проект бы не получился».", by:{
  udobnaya:["«Да что вы, это все старались!» Аня спешит поделиться заслугой.","Похвала проходит мимо. Ей привычнее, чтобы хорошо было другим.","Аня говорит: «Спасибо. Мне очень приятно»."],
  silnaya:["Аня кивает и думает: «Ну да, я же всё тащила одна».","Похвала только напоминает ей, как она устала.","Аня говорит: «Спасибо. В следующий раз мне понадобится помощь команды»."],
  otlichnitsa:["Аня смущается и сразу думает об ошибках, которых никто не заметил.","Похвала не греет: впереди новая планка.","Аня разрешает себе порадоваться без «но». Хотя бы сегодня."],
  nevidimka:["Аня опускает глаза и ждёт, когда все перестанут на неё смотреть.","Быть замеченной ей неуютно. Радость спрятана.","Аня поднимает глаза и улыбается коллегам."],
  chutkaya:["Аня следит за коллегами: вдруг кто-то обиделся, что похвалили не его?","Чужое возможное недовольство важнее её радости.","Аня принимает похвалу, не проверяя реакцию других."],
  opora:["«Спасибо! Мне было важно это услышать». Она улыбается и не оправдывается.","Признание её радует, но не определяет её ценность.","Аня отмахивается: «Да это все старались». Потом подходит к начальнику: «Спасибо. Мне было очень приятно»."]}},
 {group:"work", who:"С коллегой", title:"Грубость в чате", text:"Коллега пишет в общем чате: «Аня, ты опять всё перепутала. Сколько можно?»", by:{
  udobnaya:["«Извините, пожалуйста, сейчас всё исправлю!» Даже если перепутала не она.","Она берёт вину на себя, лишь бы конфликт не разгорелся.","Аня отвечает: «Давай проверим. Похоже, путаница была не с моей стороны»."],
  silnaya:["Аня не отвечает и молча всё переделывает сама.","Грубость осталась без ответа, а работы стало больше.","Аня пишет руководителю: «Мне нужна помощь, чтобы разобраться в ситуации»."],
  otlichnitsa:["Аня перечитывает сообщение десять раз и думает: «Я ни на что не гожусь».","Одно резкое сообщение перечёркивает годы её работы.","Аня говорит себе: «Даже если я ошиблась, со мной так говорить нельзя»."],
  nevidimka:["Аня ставит смайлик и больше не пишет. Обида уходит внутрь.","Коллега думает, что всё нормально, и продолжает в том же тоне.","Аня пишет коллеге лично: «Мне неприятен такой тон. Давай спокойнее»."],
  chutkaya:["Аня весь день ждёт новых сообщений и вздрагивает от каждого уведомления.","Тревога забирает весь рабочий день.","Аня выключает уведомления на час и спокойно делает свою работу."],
  opora:["«Давай разберёмся спокойно. И, пожалуйста, без «сколько можно»». Она отвечает твёрдо и без крика.","Она защищает себя и остаётся профессионалом.","Аня в ответ пишет резко. Потом пишет коллеге лично: «Я погорячилась. Давай разберёмся спокойно»."]}},
 {group:"work", who:"С рабочим чатом", title:"Отпуск", text:"Аня в долгожданном отпуске на море. Телефон разрывается от сообщений из рабочего чата.", by:{
  udobnaya:["Аня отвечает всем, пока дети ждут её на пляже. Неудобно не ответить.","Отпуск проходит наполовину в телефоне.","Аня пишет: «Я в отпуске до 15-го. По срочным вопросам – к Марине». И выключает чат."],
  silnaya:["Аня решает по вечерам сама сделать пару задач, чтобы потом не разгребать.","Отдых превращается в удалённую работу.","Аня просит коллегу подстраховать её до конца отпуска."],

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const N_CHILD = 9, N_ADULT = 6;
const ofGroup = g => ADULT.map((a,k)=>a.group===g?k:-1).filter(k=>k>=0);
/* Память: какие ситуации человек уже видел. При повторной игре сначала выпадают новые. */
const SEEN_KEY="ktss-seen-v1";
function loadSeen(){try{const v=JSON.parse(localStorage.getItem(SEEN_KEY));if(v&&Array.isArray(v.child)&&Array.isArray(v.adult))return v}catch(e){}return {child:[],adult:[]}}
function saveSeen(){try{localStorage.setItem(SEEN_KEY,JSON.stringify(SEEN))}catch(e){}}
let SEEN=loadSeen();
function pickAdult(sphere){
  const need = sphere==="mix" ? {rel:2,mom:2,work:2} : {[sphere]:N_ADULT};
  let out=[];
  for(const g in need){
    let unseen=ofGroup(g).filter(k=>!SEEN.adult.includes(k));
    if(unseen.length<need[g]){ SEEN.adult=SEEN.adult.filter(k=>ADULT[k].group!==g); unseen=ofGroup(g); }
    out=out.concat(shuffle(unseen).slice(0,need[g]));
  }
  return shuffle(out);
}
function fresh(){
  // по одной ситуации из каждого возраста, плюс ещё три; из каждого возраста берём не все, чтобы в следующий раз было что показать
  const bands=[0,1,2,3,4,5], inBand=b=>CHILD.map((c,k)=>c.band===b?k:-1).filter(k=>k>=0);
  const isNew=k=>!SEEN.child.includes(k);
  if(CHILD.filter((_,k)=>isNew(k)).length<N_CHILD || bands.some(b=>!inBand(b).some(isNew))) SEEN.child=[];
  const cap={}; bands.forEach(b=>cap[b]=Math.max(1,inBand(b).length-1));
  const used={}; bands.forEach(b=>used[b]=0);
  const perBand=bands.map(b=>{const pool=inBand(b).filter(isNew);const k=shuffle(pool.length?pool:inBand(b))[0];used[b]++;return k});
  const rest=[];
  const fill=pool=>{for(const k of shuffle(pool)){if(perBand.length+rest.length>=N_CHILD)break;const b=CHILD[k].band;if(perBand.includes(k)||rest.includes(k)||used[b]>=cap[b])continue;rest.push(k);used[b]++}};
  fill(CHILD.map((_,k)=>k).filter(isNew)); fill(CHILD.map((_,k)=>k));
  const childIdx = perBand.concat(rest).sort((a,b)=>CHILD[a].age-CHILD[b].age || a-b);
  const order = childIdx.map(k => shuffle(CHILD[k].opts.map((_,i)=>i)));
  return {screen:"intro", i:0, pick:null, scores:{udobnaya:0,silnaya:0,otlichnitsa:0,nevidimka:0,chutkaya:0,opora:0}, newWays:0, adultPick:null, childIdx, adultIdx:[], sphere:null, order};
}

function mk(svg,g){const rc=rough.svg(svg);g=g||svg;
 const S={stroke:'#3D3D3A',strokeWidth:1.5,roughness:.7,bowing:.8,seed:5};
 return {
  el:(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);g.appendChild(e);return e},
  P:(d,o={})=>g.appendChild(rc.path(d,{...S,...o})),
  O:(x,y,d,o={})=>g.appendChild(rc.circle(x,y,d,{...S,...o})),
  E:(x,y,w,h,o={})=>g.appendChild(rc.ellipse(x,y,w,h,{...S,...o}))}}
function grp(svg,tf){const g=document.createElementNS(NS,'g');g.setAttribute('transform',tf);svg.appendChild(g);return g}

function ages(idx, adult){
 const list = adult ? S.adultIdx.map((_,k)=>k+1) : S.childIdx.map(k=>CHILD[k].age).concat(idx>=S.childIdx.length?[ADULT_AGE]:[]);
 let h='<div class="ages" aria-label="'+(adult?'Взрослая жизнь':'Возраст Ани')+'">';
 list.forEach((a,k)=>{ if(k) h+=`<i class="${k<=idx?'done':''}"></i>`; h+=`<span class="${k<idx?'done':k===idx?'now':''}">${a}</span>`; });
 return h+'</div>';
}

   ${!nw && !op && LATER[S.adultIdx[S.i]] ? `<div class="box pink"><div class="label">К чему это может привести</div><p>${LATER[S.adultIdx[S.i]][t]}</p></div>` : ""}
   <div class="box blue"><div class="label">${otherL}</div><p class="small">${nw?v[1]:v[2]}</p></div>
   <button class="btn" id="next">${S.i<nA-1?"Дальше":"Узнать итог"}</button>
  </div>`;
 }
 else if(S.screen==="result"){
  const r=ranked(), t=TYPES[r[0][0]], op=r[0][0]==="opora";
  const second=r[1][1]>0 && r[1][0]!=="opora" && !op ? TYPES[r[1][0]] : null;
  const max=Math.max(...r.map(x=>x[1]),1);
  h=`${TOP}<div class="wrap fade" style="margin-top:18px">
   <div class="eyebrow">Как Аня стала собой</div>
   <svg class="art" data-art="both" viewBox="0 0 350 190" aria-hidden="true"></svg>
  </div>
  <div class="res fade">
   <div class="kick">Её основной способ взаимодействовать с миром</div>
   <h2>«${t.name}»</h2>
   <div class="sub">${t.short}</div>
   <p>${t.formed}</p>
   <div class="label">Во взрослой жизни</div>
   <ul>${t.adult.map(x=>`<li>${x}</li>`).join("")}</ul>
   <div class="bubble">${t.q}</div>
   <div class="sign"><span>игра «Как ты стала собой»</span>${NICK}</div>
  </div>
  <div class="wrap" style="margin-top:20px">
   <p class="note center">Сделай скриншот карточки, чтобы сохранить или поделиться в сторис</p>
   ${second?`<p>А ещё в истории Ани заметен способ «${second.name}»: ${second.short}. Обычно их несколько, и они переплетаются.</p>`:""}
   <div class="label" style="margin-top:6px">Из чего сложилась история Ани</div>
   <div class="bars">${r.map((x,k)=>`<div class="bar ${k===0?"top":""}"><span>${TYPES[x[0]].name}</span><span class="t"><i style="width:${x[1]/max*100}%;background:${k===0?"#73A886":TYPE_COL[x[0]]}"></i></span><span>${x[1]}</span></div>`).join("")}</div>
   <p>${op?`Во взрослой жизни ты ${S.newWays} ${plural(S.newWays,"раз","раза","раз")} из ${nA} посмотрела, что бывает с Аней, когда сил совсем нет. Опора – это не идеальность, а умение возвращаться к себе.`:(S.newWays===0?"Во взрослой жизни Аня ни разу не попробовала поступить по-новому. Так бывает: привычный способ кажется единственным.":`Во взрослой жизни Аня ${S.newWays} ${plural(S.newWays,"раз","раза","раз")} из ${nA} попробовала поступить по-новому. Каждый такой раз – маленький шаг к себе.`)}</p>
   <div class="box blue">
    <div class="label">Что это значит</div>
    <p class="small">Это способ, которым ребёнок справлялся с тем, что было вокруг, чтобы сохранить любовь и безопасность. Когда-то он помогал. Но ребёнок вырастает, а способ остаётся прежним, и иногда во взрослой жизни он уже мешает.</p>
    <p class="small" style="margin-top:8px">Заметить свой способ – уже много. С этим часто и приходят в терапию: чтобы появился выбор там, где раньше был только автомат.</p>
   </div>
   <div class="cta"><b>Узнала в Ане себя?</b><p class="small">Про опыт клиента и будущего терапевта – в Instagram ${NICK_A}</p></div>
   <button class="ghost" id="again">Пройти ещё раз с новыми ситуациями</button>
   <p class="note">Это игра для самоисследования, а не психологический тест и не диагноз. Аня – вымышленная героиня. Если что-то откликнулось сильно, это может быть поводом поговорить со специалистом.</p>
   ${AUTHOR}
  </div>`;
 }
 if(S.screen!=="intro" && S.screen!=="result") h+=`<div class="wrap" style="margin-top:26px">${AUTHOR}</div>`;
 app.innerHTML=h;
 drawArt(app);
 bind();
 try{ window.scrollTo({top:0}); }catch(e){}
}

function bind(){
 const $=s=>app.querySelector(s);
 $("#go")?.addEventListener("click",()=>document.getElementById("spheres").scrollIntoView({behavior:"smooth"}));
 $("#home")?.addEventListener("click",()=>{ if(S.screen==="intro") return; if(confirmLeave()){S=fresh();render()} });
 app.querySelectorAll("[data-sphere]").forEach(b=>b.addEventListener("click",()=>{
  S.sphere=b.dataset.sphere; S.adultIdx=pickAdult(S.sphere); SEEN.child=[...new Set(SEEN.child.concat(S.childIdx))]; SEEN.adult=[...new Set(SEEN.adult.concat(S.adultIdx))]; saveSeen(); S.screen="child"; S.i=0; render();
 }));
 app.querySelectorAll(".opt[data-k]").forEach(b=>b.addEventListener("click",()=>{
  S.pick=+b.dataset.k; S.scores[C(S.i).opts[S.pick][1]]++; S.screen="childReveal"; render();
 }));
 app.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>{
  S.adultPick=b.dataset.a; if(S.adultPick==="new") S.newWays++; S.screen="adultReveal"; render();
 }));
 $("#next")?.addEventListener("click",()=>{
  if(S.screen==="childReveal"){ if(S.i<S.childIdx.length-1){S.i++;S.screen="child"} else {S.screen="interlude"} }
  else if(S.screen==="interlude"){ S.i=0; S.screen="adult" }
  else if(S.screen==="adultReveal"){ if(S.i<S.adultIdx.length-1){S.i++;S.screen="adult"} else {S.screen="result"} }
  render();
 });
 $("#again")?.addEventListener("click",()=>{S=fresh();render()});
}
function confirmLeave(){ return S.screen==="result" || window.confirm("Вернуться на главную? Текущая игра начнётся заново."); }

function start(data){ S = (data && data.S && data.S.childIdx && "sphere" in data.S) ? data.S : fresh(); render(); }
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</html>
